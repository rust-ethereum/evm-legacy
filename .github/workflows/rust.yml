name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install taplo
      run: cargo install taplo-cli --locked
    - name: Rustfmt
      run: cargo fmt --all -- --check
    - name: TOML fmt
      run: taplo fmt --check
    - name: Clippy
      run: |
        cargo clippy --all -- -D warnings
        cargo clippy --all --all-features -- -D warnings
        cargo clippy --all --no-default-features -- -D warnings
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build --verbose
    - name: Build for feature (tracing)
      run: cargo build --features tracing --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build benches
      run: cargo build --benches --verbose
  build-rust-1-95:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust 1.95.0
      run: rustup toolchain install 1.95.0 --profile minimal
    - name: Build the released crates
      run: cargo +1.95.0 build --locked -p evm-legacy -p evm-core -p evm-gasometer -p evm-runtime
    - name: Build the released crates with all features
      run: |
        cargo +1.95.0 build --locked --all-features --manifest-path Cargo.toml
        cargo +1.95.0 build --locked --all-features --manifest-path core/Cargo.toml
        cargo +1.95.0 build --locked --all-features --manifest-path gasometer/Cargo.toml
        cargo +1.95.0 build --locked --all-features --manifest-path runtime/Cargo.toml
    - name: Build the released crates without default features
      run: |
        cargo +1.95.0 build --locked --no-default-features --manifest-path Cargo.toml
        cargo +1.95.0 build --locked --no-default-features --manifest-path core/Cargo.toml
        cargo +1.95.0 build --locked --no-default-features --manifest-path gasometer/Cargo.toml
        cargo +1.95.0 build --locked --no-default-features --manifest-path runtime/Cargo.toml
